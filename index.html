<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
    }

    .header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      margin: 8px 0;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: #eeeeee;
      color: #111;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      🤖 Smile AI
    </div>

    <div id="messages">
      <div class="message ai">
        Hey! I'm Smile AI 😊 How can I help you?
      </div>
    </div>

    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="Message Smile AI..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      messages.innerHTML += `
        <div class="message user">
          ${escapeHTML(message)}
        </div>
      `;

      input.value = "";
      sendButton.disabled = true;

      const loading = document.createElement("div");
      loading.className = "message ai";
      loading.textContent = "Smile is thinking... 🤔";
      messages.appendChild(loading);

      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch(
          "https://smile-ai-1.onrender.com/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        if (data.reply) {
          loading.textContent = data.reply;
        } else {
          loading.textContent =
            data.error || "Something went wrong. 😢";
        }

      } catch (error) {
        console.error(error);

        loading.textContent =
          "I couldn't connect to Smile AI. Please try again. 😢";
      }

      sendButton.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
