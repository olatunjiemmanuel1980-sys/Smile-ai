<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Smile AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --blue: #2563eb;
      --assistant: #eef1f5;
    }

    body.dark {
      --bg: #0b0f17;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #263244;
      --assistant: #1f2937;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 64px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .brand-name {
      font-weight: bold;
      font-size: 17px;
    }

    .online {
      color: #22c55e;
      font-size: 11px;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--assistant);
    }

    /* CHAT */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
    }

    /* WELCOME */

    .welcome {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-box {
      max-width: 600px;
      width: 100%;
    }

    .big-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .welcome h1 span {
      color: var(--blue);
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .try-text {
      margin-top: 28px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .suggestion {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      color: var(--text);
    }

    .suggestion:hover {
      border-color: var(--blue);
    }

    /* MESSAGES */

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message-box {
      max-width: 82%;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: var(--assistant);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    .user .time {
      text-align: right;
    }

    /* TYPING */

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 13px 16px;
      border-radius: 18px;
      background: var(--assistant);
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* INPUT */

    .input-area {
      padding: 10px 12px 14px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 17px;
      border: 1px solid var(--border);
      border-radius: 25px;
      outline: none;
      background: var(--assistant);
      color: var(--text);
    }

    #messageInput:focus {
      border-color: var(--blue);
    }

    .action {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    .voice {
      background: var(--assistant);
      color: var(--text);
    }

    .voice.listening {
      background: #ef4444;
      color: white;
    }

    .send {
      background: var(--blue);
      color: white;
    }

    .footer {
      background: var(--card);
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      padding-bottom: 7px;
    }

    @media (max-width: 600px) {
      .welcome h1 {
        font-size: 36px;
      }

      .big-logo {
        width: 70px;
        height: 70px;
        font-size: 36px;
      }

      .message-box {
        max-width: 88%;
      }

      .bubble {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>

      <div class="brand">
        <div class="logo">😊</div>

        <div>
          <div class="brand-name">Smile AI</div>
          <div class="online">● Online</div>
        </div>
      </div>

      <div class="controls">

        <button
          class="icon-btn"
          id="themeBtn"
          onclick="toggleTheme()"
        >
          🌙
        </button>

        <button
          class="icon-btn"
          id="voiceReplyBtn"
          onclick="toggleVoiceReplies()"
        >
          🔊
        </button>

        <button
          class="icon-btn"
          onclick="clearChat()"
        >
          🗑️
        </button>

      </div>

    </header>


    <div id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-box">

          <div class="big-logo">😊</div>

          <h1>
            Meet <span>Smile AI</span>
          </h1>

          <p>
            Your smart AI assistant for questions,
            coding, learning, creativity and everyday
            conversations.
          </p>

          <div class="try-text">
            Try asking
          </div>

          <div class="suggestions">

            <button
              class="suggestion"
              onclick="usePrompt('What can you do?')"
            >
              🤖 What can you do?
            </button>

            <button
              class="suggestion"
              onclick="usePrompt('Help me learn coding')"
            >
              💻 Help me learn coding
            </button>

            <button
              class="suggestion"
              onclick="usePrompt('Tell me something interesting')"
            >
              🧠 Tell me something interesting
            </button>

            <button
              class="suggestion"
              onclick="usePrompt('Give me a football fact')"
            >
              ⚽ Football fact
            </button>

          </div>

        </div>

      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Message Smile AI..."
        autocomplete="off"
      >

      <button
        class="action voice"
        id="voiceInputBtn"
        onclick="startVoiceInput()"
      >
        🎤
      </button>

      <button
        class="action send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

    <div class="footer">
      Smile AI can make mistakes. Check important information.
    </div>

  </div>


  <script>

    /* =========================
       BACKEND
    ========================= */

    const BACKEND_URL =
      "https://smile-ai-1.onrender.com/chat";


    /* =========================
       ELEMENTS
    ========================= */

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const voiceInputBtn =
      document.getElementById("voiceInputBtn");


    /* =========================
       LOAD MEMORY
    ========================= */

    let conversationHistory = [];

    let userMemories = {};


    try {
      conversationHistory =
        JSON.parse(
          localStorage.getItem(
            "smileConversation"
          ) || "[]"
        );
    } catch (error) {
      conversationHistory = [];
    }


    try {
      userMemories =
        JSON.parse(
          localStorage.getItem(
            "smileMemories"
          ) || "{}"
        );
    } catch (error) {
      userMemories = {};
    }


    /* =========================
       LEARN MEMORY
    ========================= */

    function learnMemory(message) {

      let match;


      match =
        message.match(
          /\bmy name is ([^.!?]+)/i
        );

      if (match) {
        userMemories.name =
          match[1].trim();
      }


      match =
        message.match(
          /\bmy favorite (?:footballer|player) is ([^.!?]+)/i
        );

      if (match) {
        userMemories.favoriteFootballer =
          match[1].trim();
      }


      match =
        message.match(
          /\bmy favorite (?:club|team) is ([^.!?]+)/i
        );

      if (match) {
        userMemories.favoriteClub =
          match[1].trim();
      }


      match =
        message.match(
          /\bmy favorite game is ([^.!?]+)/i
        );

      if (match) {
        userMemories.favoriteGame =
          match[1].trim();
      }


      match =
        message.match(
          /\bmy favorite color is ([^.!?]+)/i
        );

      if (match) {
        userMemories.favoriteColor =
          match[1].trim();
      }


      localStorage.setItem(
        "smileMemories",
        JSON.stringify(userMemories)
      );

    }


    /* =========================
       SAVE CHAT
    ========================= */

    function saveConversation() {

      localStorage.setItem(
        "smileConversation",
        JSON.stringify(
          conversationHistory.slice(-50)
        )
      );

    }


    /* =========================
       TIME
    ========================= */

    function getTime() {

      return new Date()
        .toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

    }


    /* =========================
       ESCAPE TEXT
    ========================= */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(
      role,
      content,
      time
    ) {

      const welcome =
        document.getElementById(
          "welcome"
        );

      if (welcome) {
        welcome.style.display = "none";
      }


      const message =
        document.createElement("div");

      message.className =
        "message " + role;


      const box =
        document.createElement("div");

      box.className =
        "message-box";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.innerHTML =
        escapeHTML(content);


      const timestamp =
        document.createElement("div");

      timestamp.className =
        "time";

      timestamp.textContent =
        time || getTime();


      box.appendChild(bubble);
      box.appendChild(timestamp);

      message.appendChild(box);

      chat.appendChild(message);


      chat.scrollTop =
        chat.scrollHeight;

    }


    /* =========================
       LOAD OLD CHAT
    ========================= */

    function loadConversation() {

      if (
        conversationHistory.length === 0
      ) {
        return;
      }


      conversationHistory.forEach(
        item => {

          addMessage(
            item.role,
            item.content,
            item.time
          );

        }
      );

    }


    /* =========================
       TYPING
    ========================= */

    function showTyping() {

      const typing =
        document.createElement("div");

      typing.id =
        "typing";

      typing.className =
        "message assistant";


      typing.innerHTML = `
        <div class="message-box">
          <div class="typing">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      `;


      chat.appendChild(typing);

      chat.scrollTop =
        chat.scrollHeight;

    }


    function removeTyping() {

      const typing =
        document.getElementById(
          "typing"
        );

      if (typing) {
        typing.remove();
      }

    }


    /* =========================
       QUICK PROMPTS
    ========================= */

    function usePrompt(text) {

      input.value =
        text;

      sendMessage();

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      learnMemory(message);


      const userMessage = {
        role: "user",
        content: message,
        time: getTime()
      };


      conversationHistory.push(
        userMessage
      );


      addMessage(
        "user",
        message,
        userMessage.time
      );


      saveConversation();

      input.value = "";

      showTyping();


      try {

        const response =
          await fetch(
            BACKEND_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  message: message,

                  history:
                    conversationHistory
                      .slice(0, -1)
                      .slice(-20)
                      .map(item => ({
                        role: item.role,
                        content: item.content
                      })),

                  memories:
                    userMemories

                })

            }
          );


        const data =
          await response.json();


        removeTyping();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error"
          );

        }


        const reply =
          data.reply ||
          "Sorry, I couldn't think of a response.";


        const assistantMessage = {
          role: "assistant",
          content: reply,
          time: getTime()
        };


        conversationHistory.push(
          assistantMessage
        );


        addMessage(
          "assistant",
          reply,
          assistantMessage.time
        );


        saveConversation();

        speak(reply);

      }

      catch (error) {

        console.error(
          "Smile AI error:",
          error
        );


        removeTyping();


        addMessage(
          "assistant",
          "Sorry 😕 I couldn't connect to Smile AI right now."
        );

      }

    }


    /* =========================
       ENTER TO SEND
    ========================= */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       THEME
    ========================= */

    function updateThemeButton() {

      const button =
        document.getElementById(
          "themeBtn"
        );

      button.textContent =
        document.body.classList.contains(
          "dark"
        )
          ? "☀️"
          : "🌙";

    }


    function toggleTheme() {

      document.body.classList.toggle(
        "dark"
      );


      localStorage.setItem(
        "smileTheme",
        document.body.classList.contains(
          "dark"
        )
          ? "dark"
          : "light"
      );


      updateThemeButton();

    }


    if (
      localStorage.getItem(
        "smileTheme"
      ) === "dark"
    ) {

      document.body.classList.add(
        "dark"
      );

    }


    updateThemeButton();


    /* =========================
       VOICE REPLIES
    ========================= */

    let voiceReplies =
      localStorage.getItem(
        "smileVoiceReplies"
      ) !== "false";


    function updateVoiceButton() {

      document.getElementById(
        "voiceReplyBtn"
      ).textContent =
        voiceReplies
          ? "🔊"
          : "🔇";

    }


    function toggleVoiceReplies() {

      voiceReplies =
        !voiceReplies;


      localStorage.setItem(
        "smileVoiceReplies",
        voiceReplies
      );


      updateVoiceButton();


      if (
        !voiceReplies &&
        "speechSynthesis" in window
      ) {

        speechSynthesis.cancel();

      }

    }


    function speak(text) {

      if (!voiceReplies) {
        return;
      }


      if (
        !("speechSynthesis" in window)
      ) {
        return;
      }


      speechSynthesis.cancel();


      const speech =
        new SpeechSynthesisUtterance(
          text
        );


      speech.lang = "en-NG";
      speech.rate = 1;
      speech.pitch = 1;


      speechSynthesis.speak(
        speech
      );

    }


    updateVoiceButton();


    /* =========================
       VOICE INPUT
    ========================= */

    function startVoiceInput() {

      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!Recognition) {

        alert(
          "Voice input is not supported by this browser."
        );

        return;

      }


      const recognition =
        new Recognition();


      recognition.lang =
        "en-NG";

      recognition.interimResults =
        false;

      recognition.maxAlternatives =
        1;


      voiceInputBtn.classList.add(
        "listening"
      );


      recognition.start();


      recognition.onresult =
        function(event) {

          input.value =
            event.results[0][0]
              .transcript;

          sendMessage();

        };


      recognition.onerror =
        function(error) {

          console.log(
            "Voice error:",
            error
          );

        };


      recognition.onend =
        function() {

          voiceInputBtn.classList.remove(
            "listening"
          );

        };

    }


    /* =========================
       CLEAR CHAT
    ========================= */

    function clearChat() {

      if (
        !confirm(
          "Clear your conversation and saved memories?"
        )
      ) {
        return;
      }


      conversationHistory = [];
      userMemories = {};


      localStorage.removeItem(
        "smileConversation"
      );

      localStorage.removeItem(
        "smileMemories"
      );


      if (
        "speechSynthesis" in window
      ) {

        speechSynthesis.cancel();

      }


      location.reload();

    }


    /* =========================
       START
    ========================= */

    loadConversation();

    input.focus();

  </script>

</body>
</html>
