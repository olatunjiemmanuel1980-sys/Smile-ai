<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111827">

  <title>Smile AI — Your AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f8fc;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --user: #2563eb;
      --assistant: #eef0f4;
    }

    body.dark {
      --bg: #0b0f17;
      --surface: #111827;
      --surface-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #263244;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --user: #2563eb;
      --assistant: #1f2937;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      transition: background 0.25s, color 0.25s;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-size: 20px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
    }

    .brand-status {
      font-size: 11px;
      color: #22c55e;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      background: var(--surface-2);
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 10px;
    }

    .welcome-content {
      width: 100%;
      max-width: 650px;
    }

    .hero-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 25px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 43px;
      box-shadow:
        0 12px 35px rgba(37, 99, 235, 0.22);
    }

    .welcome h1 {
      font-size: clamp(32px, 7vw, 52px);
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .welcome h1 span {
      color: var(--primary);
    }

    .welcome p {
      max-width: 520px;
      margin: auto;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .quick-title {
      margin-top: 30px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .quick-prompt {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      transition: 0.2s;
    }

    .quick-prompt:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;
      margin-bottom: 17px;
      animation: messageIn 0.2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message-container {
      max-width: min(82%, 700px);
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: var(--user);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: var(--assistant);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .time {
      font-size: 10px;
      opacity: 0.55;
      margin-top: 5px;
      padding: 0 4px;
    }

    .user .time {
      text-align: right;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 13px 16px;
      background: var(--assistant);
      border-radius: 18px;
      border-bottom-left-radius: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: typingBounce 1.1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-wrapper {
      padding: 12px 15px 15px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .input-area {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 17px;
      border: 1px solid var(--border);
      border-radius: 25px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      transition: 0.2s;
    }

    #messageInput:focus {
      border-color: var(--primary);
    }

    #messageInput::placeholder {
      color: var(--muted);
    }

    .action-button {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .voice-button {
      background: var(--surface-2);
      color: var(--text);
    }

    .voice-button.listening {
      background: #ef4444;
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.07);
      }
    }

    .send-button {
      background: var(--primary);
      color: white;
    }

    .send-button:hover {
      background: var(--primary-dark);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 8px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 60px;
        padding: 0 12px;
      }

      .brand-logo
