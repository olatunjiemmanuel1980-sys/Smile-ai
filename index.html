<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">

  <title>Smile AI</title>

  <style>
    :root {
      --bg: #090b10;
      --panel: #11141c;
      --panel2: #191d28;
      --text: #f4f5f8;
      --muted: #9299aa;
      --accent: #8b7cff;
      --border: #282d3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .sidebar {
      width: 250px;
      padding: 18px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0 18px;
    }

    .brand span {
      color: var(--accent);
    }

    .side-button {
      width: 100%;
      padding: 13px;
      text-align: left;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .side-button:hover {
      border-color: var(--accent);
    }

    .history-title {
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-list {
      overflow-y: auto;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      font-size: 13px;
    }

    .history-item:hover {
      background: var(--panel2);
    }

    .sidebar-bottom {
      margin-top: auto;
      display: grid;
      gap: 9px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

      height: 64px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      display: flex
