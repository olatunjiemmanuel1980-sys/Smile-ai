<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">😊</div>
      <div>
        <h1>Smile AI</h1>
        <p><span class="online-dot"></span> Your AI friend is online</p>
      </div>
    </header><main id="chat">
  <div class="message ai">
    <div class="bubble">
      Heyyy! 🥰 I'm Smile AI, your AI friend. What are we talking about today?
    </div>
    <span class="time">Now</span>
  </div>
</main>

<div class="suggestions">
  <button onclick="quickSend('Tell me a joke 😂')">😂 Tell me a joke</button>
  <button onclick="quickSend('Let us talk 🥰')">💬 Let's talk</button>
</div>

<form id="chat-form">
  <input id="user-input" type="text" placeholder="Message Smile AI..." autocomplete="off" required>
  <button id="send-btn" type="submit">➤</button>
</form>

<footer>Made with ❤️ by Smile</footer>

  </div>  <script src="script.js"></script></body>
</html>
