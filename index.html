<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <title>Smile AI</title>

  <style>
    :root {
      --bg: #090b10;
      --panel: #11141c;
      --panel2: #191d28;
      --text: #f4f5f8;
      --muted: #9299aa;
      --accent: #8b7cff;
      --border: #282d3a;
      --user: #292447;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      overflow: hidden;
    }

    button, textarea, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      font-size: 25px;
      font-weight: bold;
      margin: 8px 0 18px;
    }

    .brand span {
      color: var(--accent);
    }

    .new-chat, .side-button {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      text-align: left;
    }

    .new-chat:hover, .side-button:hover {
      border-color: var(--accent);
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin-top: 14px;
    }

    .history-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--panel2);
    }

    .sidebar-bottom {
      margin-top: auto;
      display: grid;
      gap: 9px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .top-title {
      font-weight: bold;
      font-size: 16px;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #43d49a;
      border-radius: 50%;
      margin-right: 7px;
    }

    .mobile-menu {
      display: none;
      background: transparent;
      color: var(--text);
      border: none;
      font-size: 22px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 16px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 650px;
      margin: 9vh auto 30px;
      text-align: center;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b7cff, #5143ba);
      margin: 0 auto 20px;
      font-size: 35px;
    }

    .welcome h1 {
      font-size: clamp(27px, 5vw, 40px);
      margin: 10px 0;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      padding: 14px;
      text-align: left;
      line-height: 1.5;
    }

    .suggestion:hover {
      border-color: var(--accent);
    }

    .message {
      max-width: 850px;
      margin: 0 auto 22px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--panel2);
      font-size: 16px;
    }

    .message.user .avatar {
      background: var(--user);
    }

    .message-content {
      flex: 1;
      min-width: 0;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .message-name {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .message-text {
      white-space: pre-wrap;
      font-size: 15px;
    }

    .message-time {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .message-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    .message-actions button {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
    }

    .typing {
      color: var(--muted);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { opacity: .4; }
    }

    .composer-area {
      padding: 12px 16px 8px;
      border-top: 1px solid var(--border);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
    }

    .composer textarea {
      width: 100%;
      min-height: 45px;
      max-height: 150px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 9px;
      line-height: 1.5;
    }

    .composer-buttons {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tools {
      display: flex;
      gap: 7px;
    }

    .tool-button {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 10px;
    }

    .send-button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 17px;
      border-radius: 11px;
      font-weight: bold;
    }

    .send-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .footer-note {
      max-width: 850px;
      margin: 9px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      max-width: 850px;
      margin: 0 auto 14px;
      background: #34251c;
      border: 1px solid #67472d;
      color: #ffd5a9;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: none;
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 40px #0009;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 13px;
        gap: 12px;
      }

      .welcome {
        margin-top: 5vh;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .messages {
        padding: 20px 12px;
      }

      .composer-area {
        padding: 10px;
      }

      .tool-button {
        padding: 9px;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">Smile <span>AI</span> ✨</div>

    <button class="new-chat" id="newChatBtn">＋ New chat</button>

    <div class="history-title">RECENT CHATS</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-bottom">
      <button class="side-button" id="themeBtn">🌙 Toggle theme</button>
      <button class="side-button" id="voiceToggleBtn">🔊 Voice replies: ON</button>
      <button class="side-button" id="memoryBtn">🧠 My memories</button>
      <button class="side-button" id="clearBtn">🗑️ Clear current chat</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="top-title">Smile AI <span style="color:var(--accent)">✦</span></div>
      </div>

      <div class="status" id="connectionStatus">Ready</div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="logo-circle">😊</div>
        <h1>Hey, I'm Smile AI.</h1>
        <p>Your personal AI assistant. Ask questions, learn something new, or just talk to me.</p>

        <div class="suggestions">
          <button class="suggestion">📚 Explain a difficult school topic</button>
          <button class="suggestion">💻 Help me build a website</button>
          <button class="suggestion">⚽ Tell me something about football</button>
          <button class="suggestion">✨ Give me creative ideas</button>
        </div>
      </div>
    </section>

    <div class="composer-area">
      <div class="notice hidden" id="notice"></div>

      <form class="composer" id="chatForm">
        <textarea
          id="messageInput"
          placeholder="Message Smile AI..."
          rows="1"
          maxlength="10000"
          aria-label="Your message"
        ></textarea>

        <div class="composer-buttons">
          <div class="tools">
            <button type="button" class="tool-button" id="micBtn" title="Voice input">🎤</button>
            <button type="button" class="tool-button" id="stopVoiceBtn" title="Stop voice reply">🔇</button>
          </div>

          <button type="submit" class="send-button" id="sendBtn">Send ↑</button>
        </div>
      </form>

      <div class="footer-note">
        Smile AI can make mistakes. Check important information.
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
  </html>
